[package]
name = "koharu-mobile"
version.workspace = true
edition.workspace = true
description = "Koharu's on-device manga translator for iOS and Android."
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[lib]
# Tauri links the library into the iOS app (staticlib) and Android app (cdylib).
name = "koharu_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
image = { workspace = true }
koharu-config = { workspace = true }
koharu-ml = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-renderer = { workspace = true }
koharu-runtime = { workspace = true }
koharu-scene = { workspace = true }
koharu-secrets = { workspace = true }
koharu-translator = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tauri = { workspace = true }
# The system WebView runtime; the desktop app's CEF runtime does not run on phones.
tauri-runtime-wry = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
